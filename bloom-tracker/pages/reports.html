<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — Bloom</title>
<link rel="stylesheet" href="../css/neo.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  .report-controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .report-controls .form-group { min-width: 160px; }
  .report-preview { padding: 32px; }
  .report-header { text-align: center; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 2px solid var(--border); }
  .report-summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
  .report-stat { text-align: center; padding: 16px; }
  .chart-wrap { height: 280px; }
  @media print {
    .sidebar, .topbar, .no-print { display: none !important; }
    .main-content { margin-left: 0 !important; }
    body { background: white; }
  }
</style>
</head>
<body>

<div class="app-shell">
  <div id="navSlot"></div>
  <div class="main-content">
    <div id="topbarSlot"></div>

    <div class="page-body">
      <div class="page-heading">
        <div>
          <h1>Reports</h1>
          <p>Generate detailed expense reports for any period</p>
        </div>
      </div>

      <div class="card mb-24 no-print">
        <div class="report-controls">
          <div class="form-group">
            <label class="form-label">Report Type</label>
            <select class="form-select" id="reportType">
              <option value="monthly">Monthly Summary</option>
              <option value="category">Category Breakdown</option>
              <option value="custom">Custom Date Range</option>
            </select>
          </div>
          <div class="form-group" id="monthGroup">
            <label class="form-label">Month</label>
            <input type="month" class="form-input" id="monthInput">
          </div>
          <div class="form-group hidden" id="startGroup">
            <label class="form-label">Start Date</label>
            <input type="date" class="form-input" id="startInput">
          </div>
          <div class="form-group hidden" id="endGroup">
            <label class="form-label">End Date</label>
            <input type="date" class="form-input" id="endInput">
          </div>
          <button class="btn btn-primary" onclick="generateReport()">Generate Report</button>
          <button class="btn btn-ghost" onclick="window.print()">🖨️ Print / Export PDF</button>
        </div>
      </div>

      <div class="card report-preview" id="reportContent">
        <div class="empty-state">
          <div class="empty-icon">📋</div>
          <h3>No report generated yet</h3>
          <p>Choose a report type and click "Generate Report"</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../js/core.js"></script>
<script src="../js/charts.js"></script>
<script>
  ThemeManager.init();
  if (!Auth.requireAuth()) throw new Error('redirect');
  const session = Auth.getSession();

  document.getElementById('navSlot').innerHTML = buildNav('reports.html');
  document.getElementById('topbarSlot').innerHTML = buildTopbar('Reports');

  document.getElementById('monthInput').value = new Date().toISOString().slice(0, 7);

  document.getElementById('reportType').addEventListener('change', function() {
    const type = this.value;
    document.getElementById('monthGroup').classList.toggle('hidden', type !== 'monthly' && type !== 'category');
    document.getElementById('startGroup').classList.toggle('hidden', type !== 'custom');
    document.getElementById('endGroup').classList.toggle('hidden', type !== 'custom');
  });

  let reportChart, reportChart2;

  function generateReport() {
    const type = document.getElementById('reportType').value;
    const allTx = TxManager.getAll(session.id);
    let filtered, periodLabel;

    if (type === 'custom') {
      const start = document.getElementById('startInput').value;
      const end = document.getElementById('endInput').value;
      if (!start || !end) { Notify.show('Please select both start and end dates', 'warning'); return; }
      filtered = allTx.filter(t => t.date >= start && t.date <= end);
      periodLabel = `${Fmt.date(start)} — ${Fmt.date(end)}`;
    } else {
      const monthVal = document.getElementById('monthInput').value;
      if (!monthVal) { Notify.show('Please select a month', 'warning'); return; }
      const [y, m] = monthVal.split('-').map(Number);
      filtered = allTx.filter(t => { const d = new Date(t.date); return d.getFullYear() === y && d.getMonth() === m - 1; });
      periodLabel = new Date(y, m - 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
    }

    if (filtered.length === 0) {
      document.getElementById('reportContent').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <h3>No transactions in this period</h3>
          <p>Try a different date range</p>
        </div>`;
      return;
    }

    const income = filtered.filter(t => t.type === 'income').reduce((s, t) => s + Math.abs(t.amount), 0);
    const expense = filtered.filter(t => t.type === 'expense').reduce((s, t) => s + Math.abs(t.amount), 0);
    const net = income - expense;

    const catMap = {};
    filtered.filter(t => t.type === 'expense').forEach(t => catMap[t.category] = (catMap[t.category] || 0) + Math.abs(t.amount));
    const sortedCats = Object.entries(catMap).sort((a, b) => b[1] - a[1]);

    document.getElementById('reportContent').innerHTML = `
      <div class="report-header">
        <h2>🌸 Bloom Expense Report</h2>
        <p>${periodLabel} · Generated for ${session.name}</p>
        <p style="font-size:0.75rem;">Generated on ${new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' })}</p>
      </div>

      <div class="report-summary-grid">
        <div class="report-stat neo-flat">
          <span class="label">Total Income</span>
          <div class="display-num" style="color:var(--success);font-size:1.4rem;">${Fmt.currency(income)}</div>
        </div>
        <div class="report-stat neo-flat">
          <span class="label">Total Expenses</span>
          <div class="display-num" style="color:var(--danger);font-size:1.4rem;">${Fmt.currency(expense)}</div>
        </div>
        <div class="report-stat neo-flat">
          <span class="label">Net Savings</span>
          <div class="display-num" style="color:${net >= 0 ? 'var(--success)' : 'var(--danger)'};font-size:1.4rem;">${net >= 0 ? '+' : '-'}${Fmt.currency(Math.abs(net))}</div>
        </div>
      </div>

      <div class="grid-2 mb-24">
        <div>
          <h3 class="mb-16">Category Distribution</h3>
          <div class="chart-wrap"><canvas id="reportPie"></canvas></div>
        </div>
        <div>
          <h3 class="mb-16">Category Totals</h3>
          <div class="chart-wrap"><canvas id="reportBar"></canvas></div>
        </div>
      </div>

      <h3 class="mb-16">Transaction Details (${filtered.length})</h3>
      <table class="neo-table">
        <thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="text-right">Amount</th></tr></thead>
        <tbody>
          ${filtered.sort((a,b) => new Date(b.date) - new Date(a.date)).map(t => `
            <tr>
              <td>${Fmt.date(t.date)}</td>
              <td>${t.desc}</td>
              <td><span class="badge badge-primary">${t.category}</span></td>
              <td class="text-right" style="font-weight:600;color:${t.type === 'income' ? 'var(--success)' : 'var(--danger)'};">${t.type === 'income' ? '+' : '-'}${Fmt.currency(t.amount)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;

    if (reportChart) reportChart.destroy();
    if (reportChart2) reportChart2.destroy();
    if (sortedCats.length) {
      reportChart = makePieChart(document.getElementById('reportPie'), sortedCats.map(c => c[0]), sortedCats.map(c => c[1]));
      reportChart2 = makeBarChart(document.getElementById('reportBar'), sortedCats.map(c => c[0]), [{ label: 'Spent', data: sortedCats.map(c => c[1]), backgroundColor: ChartTheme.palette, borderRadius: 6 }]);
    }

    Notify.show('Report generated', 'success');
  }

  // Auto-generate on load
  generateReport();
</script>
</body>
</html>

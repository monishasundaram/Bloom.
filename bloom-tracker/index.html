<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom — Personal Expense Tracker</title>
<link rel="stylesheet" href="css/neo.css">
<style>
  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
  .landing { max-width: 460px; width: 100%; text-align: center; }
  .landing-logo {
    width: 76px; height: 76px; border-radius: 22px; margin: 0 auto 20px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: flex; align-items: center; justify-content: center; font-size: 2.2rem;
    box-shadow: 8px 8px 18px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
  }
  .landing h1 { font-size: 2rem; margin-bottom: 8px; }
  .landing p.tagline { margin-bottom: 36px; font-size: 0.95rem; }
  .landing-actions { display: flex; flex-direction: column; gap: 12px; }
  .feature-row { display: flex; gap: 14px; margin-top: 40px; justify-content: center; flex-wrap: wrap; }
  .feature-pill {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 100px; font-size: 0.78rem; color: var(--text-muted);
  }
  .theme-fab {
    position: fixed; top: 20px; right: 20px;
  }
</style>
</head>
<body>

<button class="btn btn-ghost btn-icon theme-fab" onclick="ThemeManager.toggle()">
  <span id="themeIcon">🌙</span>
</button>

<div class="landing animate-in">
  <div class="landing-logo">🌸</div>
  <h1>Bloom</h1>
  <p class="tagline">Track your spending, grow your savings — beautifully simple expense management.</p>

  <div class="landing-actions">
    <a href="pages/login.html" class="btn btn-primary btn-full btn-lg">Sign In</a>
    <a href="pages/signup.html" class="btn btn-ghost btn-full btn-lg">Create Account</a>
  </div>

  <div class="feature-row">
    <span class="feature-pill neo-sm">📊 Visual Insights</span>
    <span class="feature-pill neo-sm">🎯 Budget Goals</span>
    <span class="feature-pill neo-sm">🔔 Smart Alerts</span>
  </div>
</div>

<script src="js/core.js"></script>
<script>
  ThemeManager.init();
  // Redirect if already logged in
  if (Auth.getSession()) {
    window.location.href = 'pages/dashboard.html';
  }
</script>
</body>
</html>

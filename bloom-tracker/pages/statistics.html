<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistics — Bloom</title>
<link rel="stylesheet" href="../css/neo.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  .chart-card { padding: 24px; }
  .chart-card .chart-wrap { height: 280px; }
  .chart-wrap.tall { height: 320px; }
  .range-tabs { display: flex; gap: 8px; padding: 4px; border-radius: 14px; }
  .range-tab { padding: 7px 14px; border-radius: 10px; border: none; background: transparent; cursor: pointer; font-family: var(--font-display); font-size: 0.8rem; font-weight: 500; color: var(--text-muted); }
  .range-tab.active { background: var(--primary); color: #fff; }
  .insight-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .insight-row:last-child { border-bottom: none; }
</style>
</head>
<body>

<div class="app-shell">
  <div id="navSlot"></div>
  <div class="main-content">
    <div id="topbarSlot"></div>

    <div class="page-body">
      <div class="page-heading">
        <div>
          <h1>Statistics</h1>
          <p>Deep dive into your spending patterns</p>
        </div>
        <div class="range-tabs neo-inset" id="rangeTabs">
          <button class="range-tab active" data-range="3">3M</button>
          <button class="range-tab" data-range="6">6M</button>
          <button class="range-tab" data-range="12">1Y</button>
        </div>
      </div>

      <div class="grid-4 mb-24" id="statGrid"></div>

      <div class="grid-2 mb-24">
        <div class="card chart-card animate-in">
          <h3 class="mb-16">Category Breakdown</h3>
          <div class="chart-wrap"><canvas id="pieChart"></canvas></div>
        </div>
        <div class="card chart-card animate-in">
          <h3 class="mb-16">Top Spending Categories</h3>
          <div class="chart-wrap"><canvas id="barHChart"></canvas></div>
        </div>
      </div>

      <div class="card chart-card mb-24 animate-in">
        <h3 class="mb-16">Spending Trend</h3>
        <div class="chart-wrap tall"><canvas id="trendChart"></canvas></div>
      </div>

      <div class="grid-2">
        <div class="card chart-card animate-in">
          <h3 class="mb-16">Income vs Expense</h3>
          <div class="chart-wrap"><canvas id="comparisonChart"></canvas></div>
        </div>
        <div class="card animate-in">
          <h3 class="mb-16">Quick Insights</h3>
          <div id="insightsList"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../js/core.js"></script>
<script src="../js/charts.js"></script>
<script>
  ThemeManager.init();
  if (!Auth.requireAuth()) throw new Error('redirect');
  const session = Auth.getSession();

  document.getElementById('navSlot').innerHTML = buildNav('statistics.html');
  document.getElementById('topbarSlot').innerHTML = buildTopbar('Statistics');

  let chartInstances = {};
  let rangeMonths = 3;
  const allTx = TxManager.getAll(session.id);

  document.querySelectorAll('.range-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.range-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      rangeMonths = parseInt(tab.dataset.range);
      render();
    });
  });

  function getRangeTx() {
    const cutoff = new Date();
    cutoff.setMonth(cutoff.getMonth() - rangeMonths);
    return allTx.filter(t => new Date(t.date) >= cutoff);
  }

  function destroyCharts() { Object.values(chartInstances).forEach(c => c?.destroy()); }

  function render() {
    destroyCharts();
    const rangeTx = getRangeTx();
    const expenses = rangeTx.filter(t => t.type === 'expense');
    const income = rangeTx.filter(t => t.type === 'income');

    const totalExpense = expenses.reduce((s, t) => s + Math.abs(t.amount), 0);
    const totalIncome = income.reduce((s, t) => s + Math.abs(t.amount), 0);
    const avgDaily = totalExpense / (rangeMonths * 30);
    const txCount = rangeTx.length;

    // Stat grid
    const stats = [
      { icon: '💸', label: `Total Spent (${rangeMonths}M)`, value: Fmt.currency(totalExpense), color: 'var(--danger)', bg: 'rgba(212,115,122,0.15)' },
      { icon: '💰', label: `Total Income (${rangeMonths}M)`, value: Fmt.currency(totalIncome), color: 'var(--success)', bg: 'rgba(110,184,154,0.15)' },
      { icon: '📅', label: 'Avg Daily Spend', value: Fmt.currency(avgDaily), color: 'var(--info)', bg: 'rgba(122,184,212,0.15)' },
      { icon: '🧾', label: 'Transactions', value: txCount, color: 'var(--primary)', bg: 'rgba(124,107,160,0.15)' }
    ];
    document.getElementById('statGrid').innerHTML = stats.map(s => `
      <div class="stat-widget">
        <div class="icon-wrap" style="background:${s.bg};color:${s.color};">${s.icon}</div>
        <span class="label">${s.label}</span>
        <span class="stat-value display-num" style="font-size:1.3rem;">${s.value}</span>
      </div>
    `).join('');

    // Category pie
    const catMap = {};
    expenses.forEach(t => catMap[t.category] = (catMap[t.category] || 0) + Math.abs(t.amount));
    const catLabels = Object.keys(catMap);
    const catValues = Object.values(catMap);

    if (catLabels.length) {
      chartInstances.pie = makePieChart(document.getElementById('pieChart'), catLabels, catValues);
    }

    // Top categories horizontal bar
    const sortedCats = Object.entries(catMap).sort((a, b) => b[1] - a[1]).slice(0, 6);
    if (sortedCats.length) {
      chartInstances.barH = makeHorizontalBar(document.getElementById('barHChart'), sortedCats.map(c => c[0]), sortedCats.map(c => c[1]), ChartTheme.palette);
    }

    // Trend line (daily/weekly depending on range)
    const trendLabels = [];
    const trendData = [];
    const days = rangeMonths * 30;
    const bucketSize = rangeMonths <= 3 ? 7 : 14; // weekly or biweekly buckets
    for (let i = days; i >= 0; i -= bucketSize) {
      const start = new Date();
      start.setDate(start.getDate() - i);
      const end = new Date(start);
      end.setDate(end.getDate() + bucketSize);
      const bucketTotal = expenses.filter(t => { const d = new Date(t.date); return d >= start && d < end; }).reduce((s, t) => s + Math.abs(t.amount), 0);
      trendLabels.push(start.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }));
      trendData.push(bucketTotal);
    }
    chartInstances.trend = makeLineChart(document.getElementById('trendChart'), trendLabels, [
      { label: 'Spending', data: trendData, borderColor: '#7C6BA0', backgroundColor: 'rgba(124,107,160,0.15)', fill: true }
    ]);

    // Income vs expense comparison
    chartInstances.comparison = makeBarChart(document.getElementById('comparisonChart'), ['Income', 'Expense'], [
      { label: 'Amount', data: [totalIncome, totalExpense], backgroundColor: ['#7CE8A8', '#E87CA8'], borderRadius: 8 }
    ]);

    // Insights
    const topCat = sortedCats[0];
    const savingsRate = totalIncome > 0 ? Math.round(((totalIncome - totalExpense) / totalIncome) * 100) : 0;
    const insights = [
      { icon: '🏆', text: topCat ? `<strong>${topCat[0]}</strong> is your top spending category at ${Fmt.currency(topCat[1])}` : 'No spending data yet' },
      { icon: '📊', text: `Your savings rate is <strong>${savingsRate}%</strong> this period` },
      { icon: '🧾', text: `You made <strong>${txCount}</strong> transactions averaging ${Fmt.currency(txCount ? totalExpense / Math.max(1, expenses.length) : 0)} per expense` },
      { icon: catLabels.length > 5 ? '🌈' : '🎯', text: `Spending spans <strong>${catLabels.length}</strong> ${catLabels.length === 1 ? 'category' : 'categories'}` }
    ];
    document.getElementById('insightsList').innerHTML = insights.map(i => `
      <div class="insight-row">
        <span style="font-size:1.3rem;">${i.icon}</span>
        <span style="font-size:0.875rem;color:var(--text-muted);">${i.text}</span>
      </div>
    `).join('');
  }

  render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Bloom</title>
<link rel="stylesheet" href="../css/neo.css">
<style>
  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card { max-width: 400px; width: 100%; padding: 36px 32px; }
  .auth-logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 28px; }
  .auth-logo .logo-icon {
    width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
    box-shadow: 4px 4px 10px var(--shadow-dark);
  }
  .auth-logo span { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; }
  .auth-title { text-align: center; margin-bottom: 6px; }
  .auth-sub { text-align: center; margin-bottom: 28px; font-size: 0.85rem; }
  .auth-footer { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-muted); }
  .theme-fab { position: fixed; top: 20px; right: 20px; }
  .strength-bar { display: flex; gap: 4px; margin-top: 6px; }
  .strength-seg { height: 4px; flex: 1; border-radius: 4px; background: var(--shadow-dark); transition: background 0.3s; }
  .strength-label { font-size: 0.72rem; color: var(--text-light); margin-top: 4px; }
</style>
</head>
<body>

<button class="btn btn-ghost btn-icon theme-fab" onclick="ThemeManager.toggle()">
  <span id="themeIcon">🌙</span>
</button>

<div class="card auth-card animate-in">
  <div class="auth-logo">
    <div class="logo-icon">🌸</div>
    <span>Bloom</span>
  </div>
  <h2 class="auth-title">Create your account</h2>
  <p class="auth-sub">Start your journey to financial clarity</p>

  <form id="signupForm" novalidate>
    <div class="form-group mb-16">
      <label class="form-label" for="name">Full Name</label>
      <input type="text" id="name" class="form-input" placeholder="Jane Doe" autocomplete="name" required>
      <span class="form-error" id="nameError">Please enter your name.</span>
    </div>

    <div class="form-group mb-16">
      <label class="form-label" for="email">Email</label>
      <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email" required>
      <span class="form-error" id="emailError">Please enter a valid email address.</span>
    </div>

    <div class="form-group mb-8">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" class="form-input" placeholder="At least 6 characters" autocomplete="new-password" required>
      <span class="form-error" id="passwordError">Password must be at least 6 characters.</span>
      <div class="strength-bar">
        <div class="strength-seg" id="seg1"></div>
        <div class="strength-seg" id="seg2"></div>
        <div class="strength-seg" id="seg3"></div>
      </div>
      <div class="strength-label" id="strengthLabel">Password strength</div>
    </div>

    <div class="form-group mb-20">
      <label class="form-label" for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" autocomplete="new-password" required>
      <span class="form-error" id="confirmError">Passwords do not match.</span>
    </div>

    <button type="submit" class="btn btn-primary btn-full btn-lg" id="signupBtn">Create Account</button>
  </form>

  <div class="auth-footer">
    Already have an account? <a href="login.html">Sign in</a>
  </div>
</div>

<script src="../js/core.js"></script>
<script>
  ThemeManager.init();
  if (Auth.getSession()) window.location.href = 'dashboard.html';

  const form = document.getElementById('signupForm');
  const nameInput = document.getElementById('name');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirmPassword');

  function validateEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  passwordInput.addEventListener('input', () => {
    const v = passwordInput.value;
    let score = 0;
    if (v.length >= 6) score++;
    if (v.length >= 10 && /[A-Z]/.test(v) && /[0-9]/.test(v)) score++;
    if (v.length >= 10 && /[!@#$%^&*]/.test(v) && /[A-Z]/.test(v) && /[0-9]/.test(v)) score++;

    const segs = [document.getElementById('seg1'), document.getElementById('seg2'), document.getElementById('seg3')];
    const colors = ['var(--danger)', 'var(--warning)', 'var(--success)'];
    const labels = ['Weak', 'Good', 'Strong'];
    segs.forEach((s, i) => s.style.background = i < score ? colors[score - 1] : 'var(--shadow-dark)');
    document.getElementById('strengthLabel').textContent = v.length === 0 ? 'Password strength' : labels[Math.max(0, score - 1)];
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    let valid = true;

    if (!nameInput.value.trim()) { nameInput.classList.add('invalid'); valid = false; } else { nameInput.classList.remove('invalid'); }
    if (!validateEmail(emailInput.value.trim())) { emailInput.classList.add('invalid'); valid = false; } else { emailInput.classList.remove('invalid'); }
    if (passwordInput.value.length < 6) { passwordInput.classList.add('invalid'); valid = false; } else { passwordInput.classList.remove('invalid'); }
    if (confirmInput.value !== passwordInput.value || !confirmInput.value) { confirmInput.classList.add('invalid'); valid = false; } else { confirmInput.classList.remove('invalid'); }

    if (!valid) return;

    const btn = document.getElementById('signupBtn');
    btn.disabled = true;
    btn.textContent = 'Creating account...';

    setTimeout(() => {
      const result = Auth.signup(nameInput.value.trim(), emailInput.value.trim(), passwordInput.value);
      if (result.ok) {
        window.location.href = 'dashboard.html';
      } else {
        btn.disabled = false;
        btn.textContent = 'Create Account';
        emailInput.classList.add('invalid');
        document.getElementById('emailError').textContent = result.msg;
        Notify.show(result.msg, 'danger');
      }
    }, 500);
  });

  [nameInput, emailInput, passwordInput, confirmInput].forEach(inp => {
    inp.addEventListener('input', () => inp.classList.remove('invalid'));
  });
</script>
</body>
</html>

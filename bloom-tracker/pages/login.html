<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Bloom</title>
<link rel="stylesheet" href="../css/neo.css">
<style>
  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card { max-width: 400px; width: 100%; padding: 36px 32px; }
  .auth-logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 28px; }
  .auth-logo .logo-icon {
    width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
    box-shadow: 4px 4px 10px var(--shadow-dark);
  }
  .auth-logo span { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; }
  .auth-title { text-align: center; margin-bottom: 6px; }
  .auth-sub { text-align: center; margin-bottom: 28px; font-size: 0.85rem; }
  .auth-footer { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-muted); }
  .theme-fab { position: fixed; top: 20px; right: 20px; }
  .demo-note {
    margin-top: 18px; padding: 12px 14px; border-radius: 12px;
    font-size: 0.78rem; color: var(--text-muted); text-align: center;
  }
</style>
</head>
<body>

<button class="btn btn-ghost btn-icon theme-fab" onclick="ThemeManager.toggle()">
  <span id="themeIcon">🌙</span>
</button>

<div class="card auth-card animate-in">
  <div class="auth-logo">
    <div class="logo-icon">🌸</div>
    <span>Bloom</span>
  </div>
  <h2 class="auth-title">Welcome back</h2>
  <p class="auth-sub">Sign in to continue tracking your finances</p>

  <form id="loginForm" novalidate>
    <div class="form-group mb-16">
      <label class="form-label" for="email">Email</label>
      <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email" required>
      <span class="form-error" id="emailError">Please enter a valid email address.</span>
    </div>

    <div class="form-group mb-20">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
      <span class="form-error" id="passwordError">Password is required.</span>
    </div>

    <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn">Sign In</button>
  </form>

  <div class="auth-footer">
    Don't have an account? <a href="signup.html">Create one</a>
  </div>

  <div class="demo-note neo-inset">
    💡 New here? Create an account to get started — we'll seed some sample data for you to explore.
  </div>
</div>

<script src="../js/core.js"></script>
<script>
  ThemeManager.init();
  if (Auth.getSession()) window.location.href = 'dashboard.html';

  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');

  function validateEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    let valid = true;

    if (!validateEmail(emailInput.value.trim())) {
      emailInput.classList.add('invalid');
      valid = false;
    } else {
      emailInput.classList.remove('invalid');
    }

    if (!passwordInput.value) {
      passwordInput.classList.add('invalid');
      valid = false;
    } else {
      passwordInput.classList.remove('invalid');
    }

    if (!valid) return;

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    setTimeout(() => {
      const result = Auth.login(emailInput.value.trim(), passwordInput.value);
      if (result.ok) {
        window.location.href = 'dashboard.html';
      } else {
        btn.disabled = false;
        btn.textContent = 'Sign In';
        Notify.show(result.msg, 'danger');
        passwordInput.classList.add('invalid');
        document.getElementById('passwordError').textContent = result.msg;
      }
    }, 500);
  });

  [emailInput, passwordInput].forEach(inp => {
    inp.addEventListener('input', () => inp.classList.remove('invalid'));
  });
</script>
</body>
</html>
